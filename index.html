<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapo Fashion | מותג אופנה</title>
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; text-align: center; }
        header { padding: 40px 20px; border-bottom: 1px solid #222; }
        h1 { font-size: 3rem; letter-spacing: 2px; margin: 0; font-weight: 800; text-transform: uppercase; }
        p { color: #888; font-size: 1.2rem; margin-top: 10px; }
        .container { max-width: 1200px; margin: 50px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; margin-top: 40px; }
        .card { background: #111; border: 1px solid #222; padding: 20px; border-radius: 8px; transition: 0.3s; }
        .card:hover { border-color: #fff; transform: translateY(-5px); }
        .card img { width: 100%; height: 350px; object-fit: cover; border-radius: 4px; background: #222; }
        .card h3 { margin: 15px 0 5px 0; font-size: 1.4rem; }
        .card .price { color: #aaa; font-weight: bold; }
        .btn { display: inline-block; background: #fff; color: #000; padding: 12px 35px; font-weight: bold; text-decoration: none; border-radius: 50px; margin-top: 30px; transition: 0.3s; }
        .btn:hover { background: #ccc; }
    </style>
</head>
<body>

    <header>
        <h1>Chapo Fashion</h1>
        <p>הקולקציה החדשה מגיעה בקרוב</p>
    </header>

    <div class="container">
        <h2>הפריטים החמים ביותר</h2>
        <div class="grid">
            <div class="card">
                <img src="https://unsplash.com" alt="ג'קט יוקרתי">
                <h3>ג'קט יוקרה שחור</h3>
                <p class="price">בקרוב</p>
            </div>
            <div class="card">
                <img src="https://unsplash.com" alt="חולצה">
                <h3>חולצת אוברסייז סטייל</h3>
                <p class="price">בקרוב</p>
            </div>
            <div class="card">
                <img src="https://unsplash.com" alt="מכנסיים">
                <h3>מכנסי קרגו מעוצבים</h3>
                <p class="price">בקרוב</p>
            </div>
        </div>
        
        <a href="https://instagram.com" class="btn" target="_blank">עקבו אחרינו באינסטגרם</a>
    </div>

</body>
</html>

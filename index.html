<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapo Fashion</title>
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; text-align: center; }
        header { padding: 40px 20px; border-bottom: 1px solid #222; }
        h1 { font-size: 3rem; margin: 0; font-weight: 800; text-transform: uppercase; }
        p { color: #888; font-size: 1.2rem; }
        .container { max-width: 1200px; margin: 50px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
        .card { background: #111; border: 1px solid #222; padding: 30px; border-radius: 8px; }
        .icon { font-size: 5rem; margin-bottom: 15px; display: block; }
        .price { color: #aaa; font-weight: bold; }
        .btn { display: inline-block; background: #fff; color: #000; padding: 12px 35px; font-weight: bold; text-decoration: none; border-radius: 50px; margin-top: 30px; }
    </style>
</head>
<body>

    <header>
        <h1>Chapo Fashion</h1>
        <p>הקולקציה החדשה מגיעה בקרוב</p>
    </header>

    <div class="container">
        <div class="grid">
            <div class="card">
                <span class="icon">🧥</span>
                <h3>ג'קט יוקרה שחור</h3>
                <p class="price">בקרוב</p>
            </div>
            <div class="card">
                <span class="icon">👕</span>
                <h3>חולצת אוברסייז</h3>
                <p class="price">בקרוב</p>
            </div>
            <div class="card">
                <span class="icon">👖</span>
                <h3>מכנסי קרגו</h3>
                <p class="price">בקרוב</p>
            </div>
        </div>
        
        <a href="https://instagram.com" class="btn" target="_blank">עקבו באינסטגרם</a>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapo Fashion | Official Store</title>
    <style>
        body { 
            background-color: #ffffff; 
            color: #000000; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        header { 
            padding: 40px 20px; 
            border-bottom: 1px solid #eeeeee; 
            text-align: center;
        }
        h1 { 
            font-size: 3.5rem; 
            margin: 0; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        .subtitle { 
            color: #666666; 
            font-size: 1.2rem; 
            margin-top: 10px; 
        }
        
        /* מבנה ראשי */
        .main-layout {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: row-reverse; /* מוצרים בימין, תפריט ועגלה בשמאל */
            gap: 40px;
        }
        
        /* אזור המוצרים מימין */
        .products-section {
            flex: 3;
        }
        
        /* סרגל צדי משמאל למעלה */
        .sidebar {
            flex: 1;
            min-width: 280px;
            height: fit-content;
            position: sticky;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        /* עגלת קניות */
        .cart-section {
            background: #fafafa;
            border: 1px solid #eeeeee;
            padding: 20px;
            border-radius: 12px;
        }
        
        /* תפריט ניווט קטגוריות */
        .nav-menu {
            background: #fafafa;
            border: 1px solid #eeeeee;
            padding: 25px 20px;
            border-radius: 12px;
            text-align: right;
        }
        .nav-menu h4 {
            margin: 0 0 15px 0;
            font-size: 1.2rem;
            border-bottom: 2px solid #000000;
            padding-bottom: 5px;
        }
        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .nav-links li {
            padding: 10px 0;
            border-bottom: 1px solid #eaeaea;
        }
        .nav-links li:last-child {
            border-bottom: none;
        }
        .nav-links a {
            color: #000000;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: #666666;
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 25px; 
        }
        .card { 
            background: #ffffff; 
            border: 1px solid #eeeeee; 
            padding: 30px 20px; 
            border-radius: 12px; 
            text-align: center;
            transition: all 0.3s ease;
        }
        .card:hover { 
            border-color: #000000; 
            transform: translateY(-5px); 
        }
        .icon { 
            font-size: 5rem; 
            margin-bottom: 20px; 
            display: block; 
        }
        .price { 
            color: #000000; 
            font-weight: 800; 
            font-size: 1.3rem;
            margin: 15px 0;
        }
        .btn-add { 
            background: #000000; 
            color: #ffffff; 
            padding: 10px 25px; 
            font-weight: bold; 
            border: none;
            border-radius: 50px; 
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-add:hover { background: #333333; }
        
        .cart-title {
            font-size: 1.2rem;
            font-weight: 700;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
            margin-top: 0;
            text-align: right;
        }
        .cart-items {
            list-style: none;
            padding: 0;
            margin: 15px 0;
            text-align: right;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eeeeee;
            font-size: 0.95rem;
        }
        .cart-total {
            font-size: 1rem;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Chapo Fashion</h1>
        <p class="subtitle">PREMIUM STREETWEAR BRAND</p>
    </header>

    <div class="main-layout">
        <!-- סרגל צדי משמאל (עגלה + קטגוריות) -->
        <div class="sidebar">
            <!-- עגלת קניות -->
            <div class="cart-section">
                <h3 class="cart-title">העגלה שלך</h3>
                <ul id="cart-list" class="cart-items">
                    <p style="color: #aaa; text-align: center; margin: 0;">העגלה ריקה</p>
                </ul>
                <div class="cart-total">
                    <span>סה"כ:</span>
                    <span id="total-price">₪0</span>
                </div>
            </div>

            <!-- תפריט קטגוריות -->
            <div class="nav-menu">
                <h4>ניווט באתר</h4>
                <ul class="nav-links">
                    <li><a href="#">בית</a></li>
                    <li><a href="#">מכנסיים ארוכים</a></li>
                    <li><a href="#">סטים</a></li>
                    <li><a href="#">חולצות ארוכות</a></li>
                    <li><a href="#">חולצות קצרות</a></li>
                    <li><a href="#">המוצרים הנמכרים ביותר</a></li>
                    <li><a href="#">מכנסיים קצרים</a></li>
                </ul>
            </div>
        </div>

        <!-- אזור המוצרים מימין -->
        <div class="products-section">
            <div class="grid">
                <div class="card">
                    <span class="icon">🧥</span>
                    <h3>ג'קט יוקרה שחור</h3>
                    <p class="price">₪450</p>
                    <button class="btn-add" onclick="addToCart('ג\'קט יוקרה שחור', 450)">הוסף לעגלה</button>
                </div>
                <div class="card">
                    <span class="icon">👕</span>
                    <h3>חולצת אוברסייז</h3>
                    <p class="price">₪180</p>
                    <button class="btn-add" onclick="addToCart('חולצת אוברסייז', 180)">הוסף לעגלה</button>
                </div>
                <div class="card">
                    <span class="icon">👖</span>
                    <h3>מכנסי קרגו</h3>
                    <p class="price">₪290</p>
                    <button class="btn-add" onclick="addToCart('מכנסי קרגו', 290)">הוסף לעגלה</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({name: name, price: price});
            total += price;
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById('cart-list');
            const totalSpan = document.getElementById('total-price');
            
            if (cart.length === 0) {
                cartList.innerHTML = '<p style="color: #aaa; text-align: center; margin: 0;">העגלה ריקה</p>';
                totalSpan.innerText = '₪0';
                return;
            }

            cartList.innerHTML = '';
            cart.forEach(item => {
                const li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `<span>${item.name}</span> <span>₪${item.price}</span>`;
                cartList.appendChild(li);
            });

            totalSpan.innerText = `₪${total}`;
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapo Fashion | Official Store</title>
    <style>
        body { 
            background-color: #ffffff; 
            color: #000000; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        header { 
            padding: 40px 20px; 
            border-bottom: 1px solid #eeeeee; 
            text-align: center;
        }
        h1 { 
            font-size: 3.5rem; 
            margin: 0; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        .subtitle { 
            color: #666666; 
            font-size: 1.2rem; 
            margin-top: 10px; 
        }
        
        /* אזור ראשי מסודר */
        .main-layout {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: row-reverse; /* דוחף את העגלה לשמאל ואת המוצרים לימין */
            gap: 40px;
        }
        
        /* אזור המוצרים מימין */
        .products-section {
            flex: 3;
        }
        
        /* עגלת קניות מקובעת משמאל למעלה */
        .cart-section {
            flex: 1;
            min-width: 300px;
            background: #fafafa;
            border: 1px solid #eeeeee;
            padding: 25px;
            border-radius: 12px;
            height: fit-content;
            position: sticky;
            top: 20px; /* נשארת למעלה כשגוללים */
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 25px; 
        }
        .card { 
            background: #ffffff; 
            border: 1px solid #eeeeee; 
            padding: 30px 20px; 
            border-radius: 12px; 
            text-align: center;
            transition: all 0.3s ease;
        }
        .card:hover { 
            border-color: #000000; 
            transform: translateY(-5px); 
        }
        .icon { 
            font-size: 5rem; 
            margin-bottom: 20px; 
            display: block; 
        }
        .price { 
            color: #000000; 
            font-weight: 800; 
            font-size: 1.3rem;
            margin: 15px 0;
        }
        .btn-add { 
            background: #000000; 
            color: #ffffff; 
            padding: 10px 25px; 
            font-weight: bold; 
            border: none;
            border-radius: 50px; 
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-add:hover { background: #333333; }
        
        .cart-title {
            font-size: 1.4rem;
            font-weight: 700;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
            margin-top: 0;
            text-align: right;
        }
        .cart-items {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            text-align: right;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eeeeee;
        }
        .cart-total {
            font-size: 1.1rem;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }
        .btn-checkout {
            display: block;
            background: #25D366;
            color: #ffffff;
            text-align: center;
            padding: 14px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2);
        }
        .btn-checkout:hover { background: #20ba59; }
    </style>
</head>
<body>

    <header>
        <h1>Chapo Fashion</h1>
        <p class="subtitle">PREMIUM STREETWEAR BRAND</p>
    </header>

    <div class="main-layout">
        <!-- אזור עגלת הקניות - עכשיו משמאל -->
        <div class="cart-section">
            <h3 class="cart-title">העגלה שלך</h3>
            <ul id="cart-list" class="cart-items">
                <p style="color: #aaa; text-align: center; margin: 0;">העגלה ריקה</p>
            </ul>
            <div class="cart-total">
                <span>סה"כ לתשלום:</span>
                <span id="total-price">₪0</span>
            </div>
            <a href="#" class="btn-checkout" onclick="checkout(event)">שלח הזמנה לוואטסאפ</a>
        </div>

        <!-- אזור המוצרים - עכשיו מימין -->
        <div class="products-section">
            <div class="grid">
                <div class="card">
                    <span class="icon">🧥</span>
                    <h3>ג'קט יוקרה שחור</h3>
                    <p class="price">₪450</p>
                    <button class="btn-add" onclick="addToCart('ג\'קט יוקרה שחור', 450)">הוסף לעגלה</button>
                </div>
                <div class="card">
                    <span class="icon">👕</span>
                    <h3>חולצת אוברסייז</h3>
                    <p class="price">₪180</p>
                    <button class="btn-add" onclick="addToCart('חולצת אוברסייז', 180)">הוסף לעגלה</button>
                </div>
                <div class="card">
                    <span class="icon">👖</span>
                    <h3>מכנסי קרגו</h3>
                    <p class="price">₪290</p>
                    <button class="btn-add" onclick="addToCart('מכנסי קרגו', 290)">הוסף לעגלה</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({name: name, price: price});
            total += price;
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById('cart-list');
            const totalSpan = document.getElementById('total-price');
            
            if (cart.length === 0) {
                cartList.innerHTML = '<p style="color: #aaa; text-align: center; margin: 0;">העגלה ריקה</p>';
                totalSpan.innerText = '₪0';
                return;
            }

            cartList.innerHTML = '';
            cart.forEach(item => {
                const li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `<span>${item.name}</span> <span>₪${item.price}</span>`;
                cartList.appendChild(li);
            });

            totalSpan.innerText = `₪${total}`;
        }

        function checkout(event) {
            event.preventDefault();
            if (cart.length === 0) {
                alert('העגלה שלך ריקה!');
                return;
            }

            // החלף את ה-972500000000 במספר הוואטסאפ האמיתי שלך
            const phoneNumber = "972500000000"; 
            
            let message = "שלום Chapo Fashion, אני רוצה להזמין מהאתר:\n\n";
            cart.forEach(item => {
                message += `- ${item.name} (₪${item.price})\n`;
            });
            message += `\n*סה"כ לתשלום: ₪${total}*`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me{phoneNumber}?text=${encodedMessage}`, '_blank');
        }
    </script>

</body>
</html>
